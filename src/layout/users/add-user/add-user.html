<div class="container p-3">
  <h1>Add User</h1>
  <div class="add-user">
    <form [formGroup]="addUser" (ngSubmit)="onSubmit()">
      <div class="row">
        <div class="col-lg-6 col-md-6 col-12">
          <mat-form-field appearance="outline" class="w-100">
            <input
              matInput
              placeholder="Enter Full Name"
              formControlName="fullName"
            />
          </mat-form-field>
        </div>

        <div class="col-lg-6 col-md-6 col-12">
          <mat-form-field appearance="outline" class="w-100">
            <input matInput placeholder="Enter Email" formControlName="email" />
          </mat-form-field>
        </div>
      </div>

      <div class="row">
        <div class="col-lg-6 col-md-6 col-12">
          <mat-form-field appearance="outline" class="w-100">
            <input matInput placeholder="Enter Phone" type="number" formControlName="phone" />
          </mat-form-field>
        </div>

        <div class="col-lg-6 col-md-6 col-12">
          <mat-form-field appearance="outline" class="w-100">
            <input
              matInput
              placeholder="Enter Password"
              formControlName="password" type="password"
            />
          </mat-form-field>
        </div>
      </div>

      <!-- <div class="row">
        <div class="col-lg-6 col-md-6 col-12">
             <mat-form-field appearance="outline" class="w-100">
            <mat-label>Role</mat-label>
            <select matNativeControl required formControlName="role">
              <option value="Vendor">Vendor</option>
              <option value="Customer">Customer</option>
            </select>
          </mat-form-field>
        </div>

        <div class="col-lg-6 col-md-6 col-12">
          <mat-form-field appearance="outline" class="w-100">
            <mat-label>Status</mat-label>
            <select matNativeControl required formControlName="status">
              <option value="active">ACTIVE</option>
              <option value="saab">INACTIVE</option>
            </select>
          </mat-form-field>
        </div>
      </div> -->

      <div class="d-flex gap-3 justify-content-center">
        <button mat-button>{{user ? 'update':'submit'}}</button>
        <button mat-button>Cancel</button>
      </div>
    </form>
  </div>
</div>
