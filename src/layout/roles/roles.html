<section class="team-members-page">
  <header class="page-header">
    <div>
      <h1>Roles</h1>
      <p>Manage user access and assigned roles.</p>
    </div>
    <button mat-flat-button class="invite-button" type="button" (click)="addRole()"  >+ Add Role</button>
  </header>

  <section class="members-card">
    <label class="search-box" for="user-search">
      <span aria-hidden="true">⌕</span>
      <input id="user-search" type="search" placeholder="Search ROles..." (keyup)="applyFilter($event)" />
    </label>

    <div class="table-scroll">
   <div class="mat-shadow-2">
  <table mat-table [dataSource]="dataSource">

    <!-- Position Column -->
    <ng-container matColumnDef="position">
      <th mat-header-cell *matHeaderCellDef> Sr. No. </th>
      <td mat-cell *matCellDef="let element; let i=index;"> {{i+1}} </td>
    </ng-container>

    <!-- Name Column -->
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef> Name </th>
      <td mat-cell *matCellDef="let element"> {{element.name}} </td>
    </ng-container>

    <!-- Weight Column -->
    <ng-container matColumnDef="weight">
      <th mat-header-cell *matHeaderCellDef> Slug </th>
      <td mat-cell *matCellDef="let element"> {{element.slug}} </td>
    </ng-container>

    <!-- Symbol Column -->
    <ng-container matColumnDef="symbol">
      <th mat-header-cell *matHeaderCellDef> Level </th>
      <td mat-cell *matCellDef="let element"> {{element.level}} </td>
    </ng-container>

   

       <!-- Symbol Column -->
    <ng-container matColumnDef="action">
      <th mat-header-cell *matHeaderCellDef> Action </th>
      <td mat-cell *matCellDef="let element"> 
        <div class="d-flex">
          <button mat-button (click)="editRole(element)">Edit</button>
          <button mat-button class="text-danger" (click)="deleteRole(element)">Delete</button>
          <button mat-button class="text-success" (click)="openPermission(element)">Manage Permission</button>
        </div>
      </td>
    </ng-container>

  

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
<tr class="mat-row" *matNoDataRow>
 
   <p class="text-center text-danger w-100"> No Data Found</p>

</tr>
  </table>

  <mat-paginator [pageSizeOptions]="[5, 10, 20]"
                 showFirstLastButtons
                 aria-label="Select page of periodic elements">
  </mat-paginator>
</div>

    </div>
  </section>
</section>
